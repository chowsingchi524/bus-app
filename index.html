<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>搭車App | 九龍東巴士小巴</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --kmb: #e11d48;
      --ctb: #eab308;
      --gmb: #16a34a;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub-pill {
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .icon-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .icon-btn:active { opacity: 0.7; }
    .icon-btn.editing {
      background: #22c55e;
      color: #052e16;
      border-color: #22c55e;
    }
    .icon-btn.danger {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.45);
    }

    main { padding: 14px; max-width: 720px; margin: 0 auto; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    .status-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      padding: 0 2px;
      font-size: 0.76rem;
      color: var(--muted);
    }
    #lastUpdated { justify-self: start; white-space: nowrap; }
    .countdown-badge { justify-self: center; color: var(--accent); font-weight: 700; white-space: nowrap; }
    #editOrderBtn { justify-self: end; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .badge-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .badge-KMB { background: var(--kmb); color: #fff; }
    .badge-CTB { background: var(--ctb); color: #0f172a; }
    .badge-GMB { background: var(--gmb); color: #fff; }

    .fare-pill {
      font-size: 0.84rem;
      font-weight: 800;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 8px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .route-num {
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1.15;
      min-width: 68px;
    }
    .route-meta { flex: 1; min-width: 0; }
    .stop-title { font-weight: 700; font-size: 1rem; margin-bottom: 3px; }
    .dest-text { font-size: 0.84rem; color: var(--muted); }

    .eta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }
    .eta-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .op-tag {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .op-KMB { background: var(--kmb); color: #fff; }
    .op-CTB { background: var(--ctb); color: #0f172a; }
    .eta-min { font-weight: 800; font-size: 1rem; color: var(--accent); }
    .eta-min.due { color: #4ade80; }
    .eta-time { font-size: 0.76rem; color: var(--muted); }
    .eta-rmk { font-size: 0.72rem; color: #fbbf24; }

    .edit-controls {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }
    .edit-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .edit-btn:disabled { opacity: 0.35; cursor: default; }
    .edit-btn.danger { color: #f87171; border-color: rgba(248, 113, 113, 0.4); margin-left: auto; }

    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 1rem;
      outline: none;
      min-width: 0;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .primary-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 8px;
      gap: 8px;
    }
    .section-label { font-size: 0.82rem; color: var(--muted); font-weight: 700; }
    .history-actions { display: flex; gap: 6px; align-items: center; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip.active, .chip:active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .chip.removable { border-color: rgba(248, 113, 113, 0.55); background: rgba(248, 113, 113, 0.12); }
    .chip-del { color: #f87171; font-weight: 800; }

    .stop-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .stop-item:last-child { border-bottom: none; }
    .stop-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pin-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pin-btn.pinned { background: rgba(250, 204, 21, 0.16); border-color: #facc15; color: #facc15; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      background: #0b1220;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 68px;
      padding: 4px 6px;
      gap: 4px;
    }
    .nav-btn {
      position: relative;
      background: transparent;
      border: none;
      border-radius: 12px;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-icon { font-size: 1.25rem; line-height: 1; }
    .nav-btn.active { background: rgba(56, 189, 248, 0.18); color: #ffffff; font-weight: 800; }
    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0; left: 22%; right: 22%;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }

    #map { width: 100%; height: 290px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 12px; z-index: 1; }
    .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .traffic-link {
      display: block; text-decoration: none;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 12px; border-radius: 12px;
      font-size: 0.88rem; font-weight: 700;
    }
    .traffic-link span { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-top: 4px; }

    .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 0.92rem; line-height: 1.7; }
    .warn-note {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a; border-radius: 12px;
      padding: 10px 12px; font-size: 0.82rem; line-height: 1.5; margin-top: 10px;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8);
      z-index: 50; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--bg); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; width: 100%; max-width: 720px; max-height: 85vh;
      display: flex; flex-direction: column;
    }
    .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .modal-body { overflow-y: auto; padding: 8px 14px 24px; }

    .picker-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.82);
      z-index: 70; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .picker-backdrop.open { display: flex; }
    .picker-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; width: 100%; max-width: 340px; padding: 18px; text-align: center;
    }
    .picker-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 10px; }
    .picker-btn {
      background: #0f172a; border: 1px solid var(--accent); color: var(--text);
      border-radius: 12px; padding: 14px 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .picker-btn:active { background: var(--accent); color: #0f172a; }
  </style>
</head>
<body>
  <header>
    <h1>🚌 搭車App <span class="sub-pill">啟德·土瓜灣·紅磡·九龍灣</span></h1>
    <button class="icon-btn" id="refreshBtn">↻ 更新</button>
  </header>

  <main>
    <!-- TAB 1: 我的車站 -->
    <section id="tab-home" class="tab-view active">
      <div class="segmented">
        <button class="seg-btn active" data-group="out">🚶 出街</button>
        <button class="seg-btn" data-group="home">🏠 屋企</button>
      </div>

      <div class="status-bar">
        <span id="lastUpdated">更新 --:--:--</span>
        <span class="countdown-badge" id="countdownText">30 秒後自動更新</span>
        <button class="icon-btn" id="editOrderBtn">✎ 編輯</button>
      </div>

      <div id="favoritesList"></div>
    </section>

    <!-- TAB 2: 搜尋路線 -->
    <section id="tab-search" class="tab-view">
      <div class="search-box">
        <input type="text" id="routeInput" placeholder="輸入路線號碼，例如 5A, 22M, 107, 88" autocomplete="off" />
        <button class="primary-btn" id="searchBtn">搜尋</button>
      </div>

      <div class="section-header-row">
        <span class="section-label">搜尋路線記錄</span>
        <div class="history-actions" id="historyActions" style="display:none;">
          <button class="icon-btn danger" id="clearHistoryBtn" style="display:none;">全部清除</button>
          <button class="icon-btn" id="editHistoryBtn">✎ 編輯</button>
        </div>
      </div>

      <div class="chips" id="searchHistoryChips"></div>

      <div id="searchResults">
        <div class="empty-state">請輸入巴士或專線小巴路線號碼搜尋。</div>
      </div>
    </section>

    <!-- TAB 3: 分區 / 附近 -->
    <section id="tab-area" class="tab-view">
      <div class="chips" id="areaChips">
        <button class="chip" data-area="nearby">📍 附近車站 (GPS)</button>
        <button class="chip active" data-area="kaitak">啟德</button>
        <button class="chip" data-area="tokwawan">土瓜灣</button>
        <button class="chip" data-area="hunghom">紅磡</button>
        <button class="chip" data-area="kowloonbay">九龍灣</button>
        <button class="chip" data-area="telford">德福</button>
      </div>
      <div id="areaStopsList"></div>
    </section>

    <!-- TAB 4: 即時交通 -->
    <section id="tab-traffic" class="tab-view">
      <div id="map"></div>
      <div class="section-label" style="margin: 12px 0 8px;">即時交通快查</div>
      <div class="link-grid">
        <a class="traffic-link" target="_blank" rel="noopener"
           href="https://www.google.com/maps/@22.3215,114.2035,14z/data=!5m1!1e1">
          🚦 九龍東即時路況
          <span>啟德 / 九龍灣 / 觀塘繞道</span>
        </a>
        <a class="traffic-link" target="_blank" rel="noopener"
           href="https://www.google.com/maps/@22.3035,114.1815,15z/data=!5m1!1e1">
          🚇 紅磡及紅隧路況
          <span>紅磡海底隧道及公主道</span>
        </a>
        <a class="traffic-link" target="_blank" rel="noopener"
           href="https://www.td.gov.hk/tc/special_news/trafficnews.htm">
          📢 運輸署特別交通消息
          <span>最新封路及突發交通事故</span>
        </a>
        <a class="traffic-link" target="_blank" rel="noopener"
           href="https://www.hkemobility.gov.hk/tc/home">
          📱 香港出行易
          <span>運輸署官方交通資訊</span>
        </a>
      </div>
    </section>
  </main>

  <!-- 路線車站彈窗 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <div class="modal-head">
        <div id="modalTitle" style="font-weight:700;">車站列表</div>
        <button class="icon-btn" id="closeModalBtn">✕ 關閉</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 收藏分類選擇彈窗 -->
  <div class="picker-backdrop" id="groupPickerBackdrop">
    <div class="picker-card">
      <div style="font-weight:700;font-size:1.05rem;">加入邊個分類？</div>
      <div id="pickerStopLabel" style="font-size:0.84rem;color:var(--muted);margin-top:4px;"></div>
      <div class="picker-actions">
        <button class="picker-btn" data-pick-group="out">🚶 出街</button>
        <button class="picker-btn" data-pick-group="home">🏠 屋企</button>
      </div>
      <button class="icon-btn" id="cancelPickerBtn" style="width:100%;">取消</button>
    </div>
  </div>

  <!-- 底部導航欄 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home">
      <span class="nav-icon">⭐</span>我的車站
    </button>
    <button class="nav-btn" data-tab="search">
      <span class="nav-icon">🔍</span>搜尋路線
    </button>
    <button class="nav-btn" data-tab="area">
      <span class="nav-icon">📍</span>分區車站
    </button>
    <button class="nav-btn" data-tab="traffic">
      <span class="nav-icon">🚦</span>即時交通
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
